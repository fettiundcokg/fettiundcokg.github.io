<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fetti &amp; Co. KG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: Pixel-Himmel mit Wolken, links und rechts Gerüsttürme aus Blöcken, Blockkran im Kopf, Gras/Erde als Boden. Ein festes Erscheinungsbild (Tag). Texturen werden per Canvas erzeugt. */
:root {
  color-scheme: light;
  --sky-1: #6FA8FF;
  --sky-2: #8DBBFF;
  --sky-3: #A9CCFF;
  --ink: #1E1B16;
  --paper: #F4EEDC;
  --yellow: #F2C12E;
  --plank: #9C7442;
  --stone: #7B7B7B;
  --f-pixel: "Press Start 2P", "Courier New", monospace;
  --f-body: "VT323", "Courier New", monospace;
  --rail: 96px;
}
* { box-sizing: border-box; }
body {
  background: linear-gradient(to bottom,
    var(--sky-1) 0 30%, var(--sky-2) 30% 62%, var(--sky-3) 62% 100%) fixed, var(--sky-1);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 22px;
  line-height: 1.3;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex; flex-direction: column;
}
.px { image-rendering: pixelated; image-rendering: crisp-edges; }

.clouds {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-repeat: repeat-x; background-position: 0 40px;
  image-rendering: pixelated;
  animation: drift 120s linear infinite;
}
@keyframes drift { from { background-position: 0 40px; } to { background-position: 1280px 40px; } }

.rail {
  position: fixed; top: 0; bottom: 0; width: var(--rail); z-index: 1; pointer-events: none;
  background-repeat: repeat-y; image-rendering: pixelated;
}
.rail--l { left: env(safe-area-inset-left, 0px); }
.rail--r { right: env(safe-area-inset-right, 0px); transform: scaleX(-1); }

.page {
  position: relative; z-index: 2; flex: 1;
  width: 100%; max-width: calc(1040px + 2 * var(--rail) + 64px); margin: 0 auto;
  padding-left: max(calc(var(--rail) + 32px), env(safe-area-inset-left, 0px));
  padding-right: max(calc(var(--rail) + 32px), env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  display: flex; flex-direction: column; gap: 28px;
}
@media (max-width: 900px) { :root { --rail: 48px; } .page { padding-left: max(calc(var(--rail) + 16px), env(safe-area-inset-left, 0px)); padding-right: max(calc(var(--rail) + 16px), env(safe-area-inset-right, 0px)); } }
@media (max-width: 520px) { .rail { display: none; } .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* Kopfleiste aus Holzbohlen */
header.top {
  margin-top: 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 14px 18px;
  background-color: var(--plank); background-size: 32px 32px; image-rendering: pixelated;
  border: 4px solid var(--ink);
  box-shadow: inset -4px -4px 0 rgba(0,0,0,.25), inset 4px 4px 0 rgba(255,255,255,.18);
}
.logo { font-family: var(--f-pixel); font-size: 14px; color: var(--paper); text-shadow: 3px 3px 0 var(--ink); line-height: 1.6; }
nav { display: flex; gap: 10px; flex-wrap: wrap; }

/* Pixel-Knopf */
.btn {
  font-family: var(--f-pixel); font-size: 11px; color: var(--paper); text-decoration: none;
  padding: 10px 14px; background: var(--stone); border: 3px solid var(--ink);
  box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.3);
  text-shadow: 2px 2px 0 var(--ink); display: inline-block; cursor: pointer;
}
.btn:hover, .btn:focus-visible { background: #8F9DD8; outline: none; }
.btn:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: end; }
@media (max-width: 820px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.crane { width: 100%; max-width: 100%; height: auto; display: block; }

/* Platzhalter-Felder */
.slot {
  background: rgba(244, 238, 220, .88);
  border: 4px solid var(--ink);
  box-shadow: 6px 6px 0 rgba(30,27,22,.45);
  padding: 22px; min-width: 0;
  display: grid; gap: 10px; align-content: start;
}
.slot-label { font-family: var(--f-pixel); font-size: 10px; letter-spacing: .06em; color: #6B6355; }
.slot h1, .slot h2 { font-family: var(--f-pixel); margin: 0; line-height: 1.4; text-wrap: balance; }
.slot h1 { font-size: clamp(18px, 3vw, 30px); }
.slot h2 { font-size: clamp(14px, 2vw, 18px); }
.ghost { height: 14px; background: repeating-linear-gradient(90deg, #C9C0AA 0 12px, transparent 12px 16px); }
.ghost.short { width: 60%; }
.ghost.mid { width: 80%; }
.slot.tall { min-height: 220px; }

.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 820px) { .grid3 { grid-template-columns: minmax(0, 1fr); } }

/* Boden */
.ground { position: relative; z-index: 2; image-rendering: pixelated; }
.ground .grass { height: 32px; background-repeat: repeat-x; background-size: 32px 32px; }
.ground .dirt {
  background-size: 32px 32px;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; font-family: var(--f-pixel); font-size: 10px; color: var(--paper); text-shadow: 2px 2px 0 var(--ink);
}

@media (prefers-reduced-motion: reduce) { .clouds { animation: none; } }
</style>

<div class="clouds" id="clouds" aria-hidden="true"></div>
<div class="rail rail--l" aria-hidden="true"></div>
<div class="rail rail--r" aria-hidden="true"></div>

<div class="page">
  <header class="top" id="topbar">
    <div class="logo">Fetti &amp; Co. KG</div>
    <nav aria-label="Hauptnavigation">
      <a class="btn" href="#bereich-1">Menü 1</a>
      <a class="btn" href="#bereich-2">Menü 2</a>
      <a class="btn" href="#bereich-3">Menü 3</a>
    </nav>
  </header>

  <div class="hero">
    <div class="slot tall">
      <span class="slot-label">PLATZHALTER · ÜBERSCHRIFT</span>
      <h1>Titel folgt</h1>
      <div class="ghost"></div>
      <div class="ghost mid"></div>
      <div class="ghost short"></div>
    </div>
    <canvas class="crane px" id="crane" width="480" height="352" role="img" aria-label="Kran aus Blöcken mit Holzbohlen am Haken"></canvas>
  </div>

  <section class="grid3" id="bereich-1" aria-label="Platzhalter-Bereich">
    <div class="slot"><span class="slot-label">PLATZHALTER</span><h2>Block 1</h2><div class="ghost"></div><div class="ghost short"></div></div>
    <div class="slot"><span class="slot-label">PLATZHALTER</span><h2>Block 2</h2><div class="ghost"></div><div class="ghost short"></div></div>
    <div class="slot"><span class="slot-label">PLATZHALTER</span><h2>Block 3</h2><div class="ghost"></div><div class="ghost short"></div></div>
  </section>

  <section class="slot tall" id="bereich-2">
    <span class="slot-label">PLATZHALTER · BEREICH 2</span>
    <h2>Inhalt folgt</h2>
    <div class="ghost"></div><div class="ghost mid"></div><div class="ghost"></div><div class="ghost short"></div>
  </section>

  <section class="slot" id="bereich-3">
    <span class="slot-label">PLATZHALTER · BEREICH 3</span>
    <h2>Inhalt folgt</h2>
    <div class="ghost mid"></div>
  </section>
</div>

<footer class="ground" aria-label="Fußzeile">
  <div class="grass" id="grass"></div>
  <div class="dirt" id="dirt">© 2026 Fetti &amp; Co. KG</div>
</footer>

<script>
(function () {
  function rng(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  function canvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  // 16x16-Texturen
  function noise(pal, seed, extra) {
    var c = canvas(16, 16), x = c.getContext('2d'), r = rng(seed);
    for (var i = 0; i < 16; i++) for (var j = 0; j < 16; j++) { x.fillStyle = pal[Math.floor(r() * pal.length)]; x.fillRect(i, j, 1, 1); }
    if (extra) extra(x, r);
    return c;
  }
  function border(x, col) { x.fillStyle = col; x.fillRect(0, 0, 16, 1); x.fillRect(0, 15, 16, 1); x.fillRect(0, 0, 1, 16); x.fillRect(15, 0, 1, 16); }

  var T = {};
  T.yellow = noise(['#F2C12E', '#E8B21C', '#F7CF4A', '#E0A916'], 7, function (x) { border(x, '#9A7410'); x.fillStyle = '#FBE08A'; x.fillRect(1, 1, 14, 1); x.fillRect(1, 1, 1, 14); });
  T.hazard = noise(['#F2C12E', '#E8B21C', '#F7CF4A'], 11, function (x) {
    for (var i = 0; i < 16; i++) for (var j = 0; j < 16; j++) if (((i + j) % 8) < 4) { x.fillStyle = (i * j) % 3 ? '#26231E' : '#34302A'; x.fillRect(i, j, 1, 1); }
    border(x, '#1E1B16');
  });
  T.planks = noise(['#A87D48', '#9C7442', '#B38653', '#93693B'], 3, function (x) {
    x.fillStyle = '#6E4E26';
    [3, 7, 11, 15].forEach(function (y) { x.fillRect(0, y, 16, 1); });
    x.fillRect(5, 0, 1, 3); x.fillRect(12, 4, 1, 3); x.fillRect(3, 8, 1, 3); x.fillRect(9, 12, 1, 3);
  });
  T.stone = noise(['#7B7B7B', '#8A8A8A', '#6E6E6E', '#959595', '#747474'], 5, function (x, r) {
    x.fillStyle = '#5E5E5E';
    for (var k = 0; k < 9; k++) x.fillRect(Math.floor(r() * 15), Math.floor(r() * 15), 2, 1);
  });
  T.dirt = noise(['#8B5A2B', '#7A4E25', '#966336', '#6C4520', '#9C6B3C'], 9);
  T.grass = noise(['#8B5A2B', '#7A4E25', '#966336', '#6C4520'], 13, function (x, r) {
    var g = ['#5DA130', '#6CB33A', '#4F8D27', '#77BF44'];
    for (var i = 0; i < 16; i++) {
      var d = 3 + Math.floor(r() * 3);
      for (var j = 0; j < d; j++) { x.fillStyle = g[Math.floor(r() * g.length)]; x.fillRect(i, j, 1, 1); }
    }
  });
  T.glass = (function () {
    var c = canvas(16, 16), x = c.getContext('2d');
    x.fillStyle = 'rgba(190,225,240,.85)'; x.fillRect(0, 0, 16, 16);
    border(x, '#DDEEF5');
    x.fillStyle = '#FFFFFF'; x.fillRect(3, 3, 1, 3); x.fillRect(4, 3, 1, 1); x.fillRect(10, 9, 1, 2);
    return c;
  })();
  T.ladder = (function () {
    var c = canvas(16, 16), x = c.getContext('2d');
    x.fillStyle = '#7A5530'; x.fillRect(2, 0, 2, 16); x.fillRect(12, 0, 2, 16);
    x.fillStyle = '#9C7442'; [1, 5, 9, 13].forEach(function (y) { x.fillRect(2, y, 12, 2); });
    x.fillStyle = '#5A3D1F'; [2, 6, 10, 14].forEach(function (y) { x.fillRect(4, y + 1, 8, 1); });
    return c;
  })();

  function url(c) { return 'url(' + c.toDataURL() + ')'; }

  // Gerüstturm-Kachel: 3 Blöcke breit, 8 Blöcke hoch
  var tile = canvas(48, 128), tx = tile.getContext('2d');
  var layout = [
    'PPP',
    'Y.Y',
    'YLY',
    'H.H',
    'PPP',
    'Y.Y',
    'YLY',
    'Y.Y'
  ];
  var map = { P: T.planks, Y: T.yellow, H: T.hazard, L: T.ladder };
  layout.forEach(function (row, y) {
    row.split('').forEach(function (ch, x) { if (map[ch]) tx.drawImage(map[ch], x * 16, y * 16); });
  });
  var railUrl = url(tile);
  document.querySelectorAll('.rail').forEach(function (el) {
    el.style.backgroundImage = railUrl;
  });
  function sizeRails() {
    var w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--rail'), 10) || 96;
    document.querySelectorAll('.rail').forEach(function (el) { el.style.backgroundSize = w + 'px ' + (w * 128 / 48) + 'px'; });
  }
  sizeRails(); window.addEventListener('resize', sizeRails);

  // Wolken
  var cl = canvas(320, 60), cx = cl.getContext('2d');
  cx.fillStyle = 'rgba(255,255,255,.92)';
  [[10, 10, 48, 12], [18, 4, 28, 8], [130, 26, 64, 12], [142, 20, 36, 8], [240, 8, 40, 10]].forEach(function (b) { cx.fillRect(b[0], b[1], b[2], b[3]); });
  cx.fillStyle = 'rgba(225,235,250,.92)';
  [[10, 22, 48, 4], [130, 38, 64, 4], [240, 18, 40, 4]].forEach(function (b) { cx.fillRect(b[0], b[1], b[2], b[3]); });
  var clouds = document.getElementById('clouds');
  clouds.style.backgroundImage = url(cl);
  clouds.style.backgroundSize = '1280px 240px';

  // Texturen für Kopfleiste und Boden
  document.getElementById('topbar').style.backgroundImage = url(T.planks);
  var g = document.getElementById('grass'); g.style.backgroundImage = url(T.grass);
  var d = document.getElementById('dirt'); d.style.backgroundImage = url(T.dirt);

  // Kran aus Blöcken (30 x 22 Blöcke à 16 px)
  var cr = document.getElementById('crane'), k = cr.getContext('2d');
  k.imageSmoothingEnabled = false;
  function b(t, x, y) { k.drawImage(T[t], x * 16, y * 16); }
  function line(x0, y0, x1, y1, col) {
    k.fillStyle = col;
    var dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 2 : -2, sy = y0 < y1 ? 2 : -2, err = dx - dy;
    while (true) {
      k.fillRect(x0, y0, 2, 2);
      if (Math.abs(x0 - x1) < 2 && Math.abs(y0 - y1) < 2) break;
      var e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
  }
  // Boden
  for (var x = 0; x < 30; x++) b('grass', x, 21);
  // Fundament
  for (x = 6; x <= 11; x++) b('stone', x, 20);
  // Turm
  for (var y = 4; y <= 19; y++) { b(y % 4 === 0 ? 'hazard' : 'yellow', 8, y); b(y % 4 === 2 ? 'hazard' : 'yellow', 9, y); }
  // Turmspitze
  b('yellow', 8, 0); b('yellow', 8, 1); b('yellow', 8, 2);
  // Kabine
  b('yellow', 10, 4); b('glass', 10, 5); b('yellow', 11, 4); b('glass', 11, 5);
  // Ausleger
  for (x = 1; x <= 28; x++) b(x % 5 === 0 ? 'hazard' : 'yellow', x, 3);
  // Gegengewicht
  b('stone', 1, 4); b('stone', 2, 4); b('stone', 3, 4); b('stone', 1, 5); b('stone', 2, 5); b('stone', 3, 5);
  // Abspannseile
  line(136, 4, 40, 48, '#2A2620');
  line(140, 4, 440, 48, '#2A2620');
  // Laufkatze
  b('stone', 22, 4);
  // Seil
  line(359, 80, 359, 218, '#2A2620');
  // Haken
  k.fillStyle = '#4A4A4A'; k.fillRect(352, 218, 16, 6); k.fillRect(352, 224, 4, 10); k.fillRect(352, 232, 14, 4);
  // Seile zur Last
  line(358, 236, 316, 254, '#2A2620');
  line(360, 236, 402, 254, '#2A2620');
  // Last: Holzbohlen und Gerüstblöcke
  for (x = 19; x <= 25; x++) b('planks', x, 16);
  for (x = 20; x <= 24; x++) b(x % 2 ? 'yellow' : 'hazard', x, 17);
})();
</script>

</body></html>
